name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (migrations, permissions, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mac
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: funeralos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mac -d funeralos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The tests connect as "mac" to funeralos_test on localhost; the
      # password comes from PGPASSWORD.
      PGPASSWORD: ci-password
      DATABASE_URL: postgresql+psycopg://mac:ci-password@localhost:5432/funeralos_test
      JWT_SECRET_KEY: ci-only-secret-key-that-is-long-enough-for-hs256

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Migrations have a single head
        run: |
          heads=$(alembic heads | wc -l)
          echo "alembic heads: $heads"
          test "$heads" -eq 1

      - name: alembic upgrade head
        run: alembic upgrade head

      - name: Seed permissions
        run: python -m app.seed_permissions

      - name: Run tests
        run: python -m pytest tests -q -p no:cacheprovider

  frontend:
    name: Frontend (type-check and build)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
