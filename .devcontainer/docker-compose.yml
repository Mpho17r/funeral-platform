services:
  app:
    image: mcr.microsoft.com/devcontainers/python:3.13
    volumes:
      - ..:/workspaces/funeral-platform:cached
    command: sleep infinity
    # Share the database container's network so Postgres is on localhost:5432,
    # which is where the test suite expects it.
    network_mode: service:db

  db:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: mac
      POSTGRES_PASSWORD: mac
      POSTGRES_DB: funeralos

volumes:
  pgdata:
